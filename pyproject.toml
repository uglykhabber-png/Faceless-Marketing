[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceless-marketing"
version = "0.1.0"
description = "Ethical, measurable, local-first marketing utilities for open-source projects."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
faceless-marketing = "faceless_marketing.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
